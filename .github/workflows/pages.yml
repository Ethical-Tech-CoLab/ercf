name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Queue deploys: back-to-back pushes otherwise fail with "in progress deployment"
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate docs/snapshot/ from historical_data.py and calculators.py
        run: |
          python snapshot.py
          rm -rf docs/snapshot
          cp -r snapshot docs/snapshot
      - name: Build docs/index.html and docs/app.js from static/
        run: |
          cp static/index.html docs/index.html
          sed -i 's|src="/static/app.js"|src="app.js"|g' docs/index.html
          cp static/app.js docs/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4
