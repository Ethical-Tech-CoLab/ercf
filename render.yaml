# Render Blueprint — free-tier backend for the GitHub Pages frontend.
# The free plan sleeps after 15 min idle (first request takes ~30–60 s)
# and has an ephemeral disk, so saved scenarios reset on each restart.
services:
  - type: web
    name: ercf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACAPS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UCDP_API_TOKEN
        sync: false
      - key: GEONAMES_USERNAME
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
